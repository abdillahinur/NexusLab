# Expected exit: 0. Capacity loss is not a link-down event and does not drop chunks.
version: 1
gpus: 512
seed: 42
routing_policy: queue-aware
bandwidth_bps: 8000000000
propagation_ns: 25
buffer_bytes: 262144
failure_script:
  version: 1
  detection: immediate
  incidents:
    - kind: link_degraded
      target: 576
      at_ns: 2500
      recover_at_ns: 10000
      bandwidth_bps: 4000000000
jobs:
  - name: affected
    workers: [0, 64]
    arrival_ns: 0
    steps: 1
    compute_ns: 1000
    gradient_bytes: 4000
    bucket_bytes: 4000
    chunk_bytes: 1000
  - name: after-restoration
    workers: [8, 72]
    arrival_ns: 5000
    steps: 1
    compute_ns: 1000
    gradient_bytes: 4000
    bucket_bytes: 4000
    chunk_bytes: 1000
